<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device_width, initial-scale=1.0">
        <title>Arcania Wiki</title>
    </head>
    <body>
        <header>
            <h1>Borderlands 2 Arcania</h1>
            <p>Documentation</p>
        </header>

        <main>
            <h2>Articles</h2>

            {% for article in articles %}
                <article>
                    <h3>
                        <a href="{% url 'arcaniawiki:article_detail' slug=article.slug %}">
                            {{ article.title }}
                        </a>
                    </h3>

                    <p>Last updated: {{ article.updated_at|date:"d.m.Y H:i" }}</p>
                </article>
            {% empty %}
                <p>No articles.</p>
            {% endfor %}
        </main>
    </body>
</html>
