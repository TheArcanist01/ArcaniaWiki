{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>{% block title %}Arcania Wiki{% endblock %}</title>

        <link rel="stylesheet" href="{% static 'arcaniawiki/css/style.css' %}">
    </head>
    <body>
        <header class="site-header">
            <div class="container">
                <a class="site-logo" href="{% url 'arcaniawiki:article_list' %}">
                    Arcania Wiki
                </a>

                <nav class="site-nav">
                    <a href="{% url 'arcaniawiki:article_list' %}">
                        Main page
                    </a>
                </nav>
            </div>
        </header>

        <main class="container main-content">
            {% block content %}{% endblock %}
        </main>

        <footer class="site-footer">
            <div class="container">
                <p>Borderlands 2 Arcania mod</p>
            </div>
        </footer>
    </body>
</html>
