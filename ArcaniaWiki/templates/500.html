{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server error | Arcania Wiki</title>
    <link rel="icon" href="{% static 'arcaniawiki/img/favicon.ico' %}" sizes="any">
    <link rel="stylesheet" href="{% static 'arcaniawiki/css/style.css' %}">
</head>
<body>
    {# Kept independent of base.html, so it still shows when something is broken. #}
    <main class="content" style="max-width: 720px; margin: 80px auto; padding: 0 24px;">
        <header class="page-header">
            <p class="eyebrow">Error 500</p>
            <h1>Something went wrong</h1>
            <p class="page-description">The page could not be displayed because of an error on the server. Please try again later.</p>
            <a class="text-link" href="/">Back to the home page</a>
        </header>
    </main>
</body>
</html>
